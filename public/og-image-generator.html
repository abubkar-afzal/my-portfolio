<!DOCTYPE html>
<html>
<head>
    <title>OG Image Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        
        .container {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0000 0%, #2d0000 25%, #1a0000 50%, #2d0000 75%, #1a0000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 80px;
        }
        
        /* Decorative neon glow effects */
        .glow-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(238,66,66,0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0,105,255,0.15) 0%, transparent 50%);
        }
        
        /* Border lines */
        .border-line {
            position: absolute;
            top: 40px;
            left: 40px;
            right: 40px;
            bottom: 40px;
            border: 2px solid rgba(238,66,66,0.3);
            border-radius: 20px;
        }
        
        /* Profile icon */
        .profile-icon {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ee4242, #ff0000c0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            box-shadow: 0 0 60px rgba(238,66,66,0.6);
            border: 3px solid rgba(255,255,255,0.2);
        }
        
        .profile-icon span {
            font-size: 85px;
        }
        
        /* Name */
        .name {
            font-size: 52px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(238,66,66,0.5);
            letter-spacing: -0.02em;
        }
        
        /* Title */
        .title {
            font-size: 34px;
            color: #ee4242;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(238,66,66,0.8);
        }
        
        /* Description */
        .description {
            font-size: 22px;
            color: #cccccc;
            text-align: center;
            max-width: 800px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        
        /* Tech stack */
        .tech-stack {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .tech-item {
            padding: 8px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 50px;
            font-size: 16px;
            color: #ee4242;
            border: 1px solid rgba(238,66,66,0.3);
        }
        
        /* Footer */
        .footer {
            position: absolute;
            bottom: 40px;
            font-size: 18px;
            color: #888888;
            text-align: center;
            width: 100%;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glow-bg"></div>
        <div class="border-line"></div>
        
        <div class="profile-icon">
            <span>👨‍💻</span>
        </div>
        
        <div class="name">
            Hafiz Abubakar Afzal
        </div>
        
        <div class="title">
            Developer & Designer
        </div>
        
        <div class="description">
            Creating amazing digital experiences through code and design
        </div>
        
        <div class="tech-stack">
            <div class="tech-item">React</div>
            <div class="tech-item">Next.js</div>
            <div class="tech-item">TypeScript</div>
            <div class="tech-item">UI/UX</div>
            <div class="tech-item">Node.js</div>
        </div>
        
        <div class="footer">
            hafizabubakarafzal.vercel.app
        </div>
    </div>
</body>
</html>
